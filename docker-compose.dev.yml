version: "3.9"

# Dev stack — source code mounted, hot-reload on backend, Vite dev server on frontend
services:
  mongo:
    image: mongo:7
    container_name: mongo-dev
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_dev_data:/data/db
    networks:
      - app-dev-net

  backend:
    image: node:20-alpine
    container_name: backend-dev
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo-dev:27017/crudapp_dev
      JWT_SECRET: dev_secret_not_for_prod
      CLIENT_ORIGIN: http://localhost:3000
      NODE_ENV: development
      LOG_LEVEL: debug
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      - mongo
    networks:
      - app-dev-net

  frontend:
    image: node:20-alpine
    container_name: frontend-dev
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - app-dev-net

volumes:
  mongo_dev_data:
  backend_node_modules:
  frontend_node_modules:

networks:
  app-dev-net:
    driver: bridge
